{% extends "base.html" %}{% block body %}
<form method="post" class="card auth"><h1>🛒 Purchase Predictor</h1><p class="mut">{{ 'Create your account' if mode=='register' else 'Sign in to your workspace' }}</p>
<input type="hidden" name="csrf" value="{{ csrf() }}">
{% if mode=='register' %}<label>Name</label><input name="name" required>{% endif %}
<label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" minlength="6" required><br><br>
<div class="row"><button>{{ 'Create account' if mode=='register' else 'Sign in' }}</button>
<a href="{{ url_for('login' if mode=='register' else 'register') }}">{{ 'Have an account?' if mode=='register' else 'Need an account?' }}</a></div></form>{% endblock %}
